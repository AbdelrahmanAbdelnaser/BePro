<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <div class="dashboard">
      <div class="sidebar">
        <h2 onclick="goto('index')">BePro</h2>
        <ul>
          <li style="background: blueviolet">Dashboard</li>
          <li onclick="goto('courses')">My Courses</li>
          <li>Progress</li>
          <li>Certificates</li>
        </ul>
      </div>

      <div class="main">
        <div class="topbar">
          <h2>Welcome Back 👋</h2>
          <button onclick="goto('login')">Logout</button>
        </div>

        <div class="dashboard-cards">
          <div class="dashboard-card">
            <h3>5</h3>
            <p>Enrolled Courses</p>
          </div>

          <div class="dashboard-card">
            <h3>12</h3>
            <p>Completed Lessons</p>
          </div>

          <div class="dashboard-card">
            <h3>3</h3>
            <p>Certificates</p>
          </div>
        </div>

        <div class="dashboard-courses">
          <h2>My Courses</h2>

          <div class="course-box">
            <p>JavaScript Mastery</p>
            <span class="badge">In Progress</span>
          </div>

          <div class="course-box">
            <p>React.js</p>
            <span class="badge">In Progress</span>
          </div>

          <div class="course-box">
            <p>UX/UI Design</p>
            <span class="badge">Completed</span>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/main.js"></script>
  </body>
</html>
